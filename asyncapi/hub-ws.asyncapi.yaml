    channel:
      $ref: '#/channels/hub'
    title: Live state for a subscribed device on the hub path
    summary: 'After state_subscribe: first the current state of every visible entity (snapshot), then every change of an entity visible to the device.'
    messages:
    - $ref: '#/channels/hub/messages/s2c.entity_state'
  receive_ping:
    action: receive
    channel:
      $ref: '#/channels/hub'
    title: Client sends ping
    summary: Any session; answered with pong.
    messages:
    - $ref: '#/channels/hub/messages/ping'
    reply:
      channel:
        $ref: '#/channels/hub'
      messages:
      - $ref: '#/channels/hub/messages/pong'
    x-requires: any
  receive_pong:
    action: receive
    channel:
      $ref: '#/channels/hub'
    title: Client answers the server ping
    summary: Marks the connection alive. Without pong the hub drops the connection (~40-60 s). The Admin UI does not answer
      today.
    messages:
    - $ref: '#/channels/hub/messages/pong'
    x-requires: authenticated
  send_handshake:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Handshake result on connect
    summary: 'Right after accept: auth_ok for Ingress and integration sessions (no client message needed), otherwise auth_required
      with timeout 30.'
    messages:
    - $ref: '#/channels/hub/messages/s2c.auth_ok'
    - $ref: '#/channels/hub/messages/s2c.auth_required'
  send_auth_required_reject:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Reject messages before authentication
    summary: Any message other than pair/auth/client_reset_ack/ping on an unauthenticated session is answered with auth_required
      (without timeout), not error.
