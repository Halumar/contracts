      own access (at most 2 MiB, one per second per entity and device). Kids: blocked device types → rule_blocked.'
    messages:
    - $ref: '#/channels/hub/messages/c2s.camera_image_get'
    x-requires: paired-client
    reply:
      channel:
        $ref: '#/channels/hub'
      messages:
      - $ref: '#/channels/hub/messages/s2c.camera_image'
