operations:
  receive_pair:
    action: receive
    channel:
      $ref: '#/channels/hub'
    title: Client sends pair
    summary: Pair a new device with the active PIN (unauthenticated sessions only, 5 attempts per connection). Success authenticates
      the connection.
    messages:
    - $ref: '#/channels/hub/messages/c2s.pair'
    x-requires: unauthenticated
    reply:
      channel:
        $ref: '#/channels/hub'
      messages:
      - $ref: '#/channels/hub/messages/s2c.pair_ok'
      - $ref: '#/channels/hub/messages/s2c.pair_error'
      - $ref: '#/channels/hub/messages/s2c.upgrade_required'
  receive_auth:
    action: receive
    channel:
      $ref: '#/channels/hub'
    title: Client sends auth
    summary: Authenticate with the client secret (5 attempts per connection). Query-string tokens are not supported.
    messages:
    - $ref: '#/channels/hub/messages/c2s.auth'
    x-requires: unauthenticated
    reply:
      channel:
        $ref: '#/channels/hub'
      messages:
      - $ref: '#/channels/hub/messages/s2c.auth_ok'
      - $ref: '#/channels/hub/messages/s2c.auth_error'
      - $ref: '#/channels/hub/messages/s2c.client_removed'
      - $ref: '#/channels/hub/messages/s2c.upgrade_required'
  receive_client_reset_ack:
    action: receive
    channel:
      $ref: '#/channels/hub'
    title: Client sends client_reset_ack
    summary: Device confirms it wiped its credentials after client_removed. Accepted authenticated, or unauthenticated for
      exactly the pending id signalled during auth. Purges the tombstone; server answers client_reset_ack_ok and closes 1000.
    messages:
    - $ref: '#/channels/hub/messages/c2s.client_reset_ack'
    x-requires: paired-client or pending-removal socket
    reply:
      channel:
        $ref: '#/channels/hub'
      messages:
      - $ref: '#/channels/hub/messages/s2c.client_reset_ack_ok'
      - $ref: '#/channels/hub/messages/s2c.error'
  receive_client_leave:
    action: receive
    channel:
      $ref: '#/channels/hub'
    title: Client sends client_leave
    summary: The device signs itself off (reset, remove home). The hub deletes it at once, removes its HA user, answers
      client_leave_ok and closes 1000.
    messages:
    - $ref: '#/channels/hub/messages/c2s.client_leave'
    x-requires: paired-client
    reply:
      channel:
        $ref: '#/channels/hub'
      messages:
      - $ref: '#/channels/hub/messages/s2c.client_leave_ok'
      - $ref: '#/channels/hub/messages/s2c.error'
  receive_watch_access_get:
    action: receive
    channel:
      $ref: '#/channels/hub'
    title: Phone sends watch_access_get
    summary: The phone that set up a watch asks for the watch's HA access, sealed to the watch's key.
    messages:
    - $ref: '#/channels/hub/messages/c2s.watch_access_get'
    x-requires: paired-client
    reply:
      channel:
        $ref: '#/channels/hub'
      messages:
      - $ref: '#/channels/hub/messages/s2c.watch_access'
  send_watch_access:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Hub pushes watch_access
    summary: The access of a watch changed (new or rotated HA token, profile, rules); the hub pushes it, sealed to the
      watch's key, to every connection of the device that set the watch up.
    messages:
    - $ref: '#/channels/hub/messages/s2c.watch_access'
  receive_subscribe:
    action: receive
    channel:
      $ref: '#/channels/hub'
    title: Client sends subscribe
    summary: No-op; answered with 'subscribed'. Clients need not send it.
    messages:
    - $ref: '#/channels/hub/messages/c2s.subscribe'
    x-requires: authenticated
    reply:
      channel:
        $ref: '#/channels/hub'
      messages:
      - $ref: '#/channels/hub/messages/s2c.subscribed'
  receive_get_areas:
    action: receive
    channel:
      $ref: '#/channels/hub'
    title: Client sends get_areas
    summary: Request the visible active areas (filtered by client tags; a guest without tags gets an empty list).
    messages:
    - $ref: '#/channels/hub/messages/c2s.get_areas'
    x-requires: authenticated
    reply:
      channel:
        $ref: '#/channels/hub'
      messages:
      - $ref: '#/channels/hub/messages/s2c.areas'
      - $ref: '#/channels/hub/messages/s2c.error'
  receive_get_area:
    action: receive
    channel:
      $ref: '#/channels/hub'
    title: Client sends get_area
    summary: Request one area with sections, entities (live state) and widgets. Paired clients only get areas of their own scope (their area list by tags, plus areas their notifications link to); other ids are answered with error 'Area not found'. Server paths are stripped and entity states sanitized for paired clients.
    messages:
    - $ref: '#/channels/hub/messages/c2s.get_area'
    x-requires: authenticated
    reply:
      channel:
        $ref: '#/channels/hub'
      messages:
      - $ref: '#/channels/hub/messages/s2c.area'
      - $ref: '#/channels/hub/messages/s2c.error'
