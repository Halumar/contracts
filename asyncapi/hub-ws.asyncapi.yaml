    action: send
    channel:
      $ref: '#/channels/hub'
    title: Admin web-UI session ended
    summary: Sessions authenticated by the admin session cookie (client_id 'admin', TLS, same Origin) get session_expired
      when the session expires, is evicted or logged out; followed by close 4401. The UI returns to its login page.
    messages:
    - $ref: '#/channels/hub/messages/s2c.session_expired'
    x-audience: ADMIN
  send_auth_timeout:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Unauthenticated timeout
    summary: 30 s after connect without successful auth/pair; followed by close 4002.
    messages:
    - $ref: '#/channels/hub/messages/s2c.auth_timeout'
  send_ping:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Server heartbeat
    summary: Every 30 s to authenticated sessions.
    messages:
    - $ref: '#/channels/hub/messages/ping'
  send_error:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Protocol errors
    summary: Unknown type, invalid JSON, message > 64 KB, read-only integration session.
    messages:
    - $ref: '#/channels/hub/messages/s2c.error'
  send_client_removed:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Device deleted by an admin
    summary: Sent to live connections of a deleted client; client answers client_reset_ack, otherwise close 4001 after 10
      s.
    messages:
    - $ref: '#/channels/hub/messages/s2c.client_removed'
  send_guest_extended:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Guest expiry extended (targeted)
    summary: Sent to the connected guest.
    messages:
    - $ref: '#/channels/hub/messages/s2c.guest_extended'
  send_client_config_updated:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Config changed (targeted)
    summary: After token rotation only the affected client gets client_config_updated; the old token is revoked after its
      get_client_config + 3 s (max 5 s without fetch).
    messages:
    - $ref: '#/channels/hub/messages/bc.client_config_updated'
    x-audience: TARGETED
  send_areas_changed:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Area list changed (paired apps)
    summary: After creating, duplicating or deleting an area, every paired app session whose area list can change gets areas_changed (no payload) and answers with get_areas. Admin sessions get area_created / area_deleted / areas_deleted instead.
    messages:
    - $ref: '#/channels/hub/messages/bc.areas_changed'
    x-audience: TARGETED
  send_entity_updated:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Entity placement changed (area scope)
    summary: After PUT /api/areas/{area_id}/entities/{entity_id} (name, size, visibility, control mode, tile settings). Goes to admin sessions, the integration and every paired app that may read the area; data.changed names the changed fields (e.g. ["tile"]). Apps answer with get_area.
    messages:
    - $ref: '#/channels/hub/messages/bc.entity_updated'
    x-audience: TARGETED
  send_command:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Remote commands
    summary: Sent to one paired client (integration services or admin actions).
    messages:
    - $ref: '#/channels/hub/messages/cmd.clear_notifications'
    - $ref: '#/channels/hub/messages/cmd.dismiss_notification'
    - $ref: '#/channels/hub/messages/cmd.display_notification'
    - $ref: '#/channels/hub/messages/cmd.navigate_to_area'
    - $ref: '#/channels/hub/messages/cmd.refresh'
    - $ref: '#/channels/hub/messages/cmd.show_entity'
    - $ref: '#/channels/hub/messages/cmd.panel_command'
    x-audience: TARGETED
  send_onboarding_result:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Onboarding progress and result to the waiting device
    summary: 'onboard_claimed when a confirming device looked the session up; onboard_ok after a confirmation (the connection is authenticated as the new device), or onboard_error when the session ended otherwise (declined, cancelled, session_expired, session_invalidated).'
    messages:
    - $ref: '#/channels/hub/messages/s2c.onboard_claimed'
    - $ref: '#/channels/hub/messages/s2c.onboard_ok'
    - $ref: '#/channels/hub/messages/s2c.onboard_error'
    x-audience: TARGETED
  send_guest_invite_result:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Invitation result to the inviting device
    summary: 'guest_invite_ended to every connection of the inviting device: paired (a guest paired with the PIN), expired, revoked (admin), replaced, invalidated.'
    messages:
    - $ref: '#/channels/hub/messages/s2c.guest_invite_ended'
    x-audience: TARGETED
  send_family_push:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Family pushes (targeted)
    summary: 'family_request and family_child_updated to every connection of every family manager of the child; kids_request_state to the child device when its request is answered or expires.'
    messages:
    - $ref: '#/channels/hub/messages/s2c.family_request'
    - $ref: '#/channels/hub/messages/s2c.family_child_updated'
    - $ref: '#/channels/hub/messages/s2c.kids_request_state'
    x-audience: TARGETED
  send_access_request_push:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Early access pushes (targeted)
    summary: 'access_request_update to every connection of every recipient device (away through family_relay); access_request_state to the requesting device on every change of its request.'
    messages:
    - $ref: '#/channels/hub/messages/s2c.access_request_update'
    - $ref: '#/channels/hub/messages/s2c.access_request_state'
    x-audience: TARGETED
  send_broadcast_all:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Broadcast to every authenticated session
    summary: Data changes. Apps react with get_areas/get_area or get_client_config.
    messages:
    - $ref: '#/channels/hub/messages/bc.area_updated'
    - $ref: '#/channels/hub/messages/bc.client_config_updated'
    - $ref: '#/channels/hub/messages/bc.entity_added'
    - $ref: '#/channels/hub/messages/bc.entity_removed'
    - $ref: '#/channels/hub/messages/bc.layout_updated'
    - $ref: '#/channels/hub/messages/bc.section_created'
    - $ref: '#/channels/hub/messages/bc.section_deleted'
    - $ref: '#/channels/hub/messages/bc.section_updated'
    - $ref: '#/channels/hub/messages/bc.widget_created'
    - $ref: '#/channels/hub/messages/bc.widget_deleted'
    - $ref: '#/channels/hub/messages/bc.widget_updated'
    x-audience: ALL
  send_broadcast_admin:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Broadcast to admin sessions
    summary: Management events for Ingress/dev sessions (Admin UI). Paired apps get areas_changed instead of area_created / area_deleted / areas_deleted.
    messages:
    - $ref: '#/channels/hub/messages/bc.area_created'
    - $ref: '#/channels/hub/messages/bc.area_deleted'
    - $ref: '#/channels/hub/messages/bc.areas_deleted'
    - $ref: '#/channels/hub/messages/bc.client_connected'
    - $ref: '#/channels/hub/messages/bc.client_disconnected'
    - $ref: '#/channels/hub/messages/bc.client_kicked'
    - $ref: '#/channels/hub/messages/bc.client_paired'
    - $ref: '#/channels/hub/messages/bc.client_status_updated'
    - $ref: '#/channels/hub/messages/bc.clients_cleared'
    - $ref: '#/channels/hub/messages/bc.device_activity'
    - $ref: '#/channels/hub/messages/bc.guest_extended'
    - $ref: '#/channels/hub/messages/bc.guests_expired'
    - $ref: '#/channels/hub/messages/bc.notification_created'
    - $ref: '#/channels/hub/messages/bc.notification_deleted'
    - $ref: '#/channels/hub/messages/bc.notification_delivered'
    - $ref: '#/channels/hub/messages/bc.notification_dismissed'
    - $ref: '#/channels/hub/messages/bc.notifications_cleared'
    - $ref: '#/channels/hub/messages/bc.onboarding_ended'
    - $ref: '#/channels/hub/messages/bc.onboarding_started'
    - $ref: '#/channels/hub/messages/bc.onboarding_claimed'
    - $ref: '#/channels/hub/messages/bc.guest_invite_closed'
    - $ref: '#/channels/hub/messages/bc.guest_invite_opened'
    - $ref: '#/channels/hub/messages/bc.pairing_cancelled'
    - $ref: '#/channels/hub/messages/bc.pairing_started'
    - $ref: '#/channels/hub/messages/bc.profiles_changed'
    - $ref: '#/channels/hub/messages/bc.family_changed'
    - $ref: '#/channels/hub/messages/bc.access_requests_changed'
    - $ref: '#/channels/hub/messages/bc.log_entry'
    - $ref: '#/channels/hub/messages/bc.log_read'
    x-audience: ADMIN
  send_broadcast_integration:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Broadcast to the integration push session
    summary: The integration session receives ALL and ADMIN broadcasts unchanged, except notification_created which is reduced
      to ids and log_entry / log_read, which it never gets. It treats every message except auth_ok, pong, subscribed and error as refresh trigger.
    messages:
    - $ref: '#/channels/hub/messages/bc.area_created'
    - $ref: '#/channels/hub/messages/bc.area_deleted'
    - $ref: '#/channels/hub/messages/bc.area_updated'
    - $ref: '#/channels/hub/messages/bc.areas_deleted'
    - $ref: '#/channels/hub/messages/bc.client_config_updated'
    - $ref: '#/channels/hub/messages/bc.client_connected'
    - $ref: '#/channels/hub/messages/bc.client_disconnected'
    - $ref: '#/channels/hub/messages/bc.client_kicked'
    - $ref: '#/channels/hub/messages/bc.client_paired'
    - $ref: '#/channels/hub/messages/bc.client_status_updated'
    - $ref: '#/channels/hub/messages/bc.clients_cleared'
    - $ref: '#/channels/hub/messages/bc.device_activity'
    - $ref: '#/channels/hub/messages/bc.entity_added'
    - $ref: '#/channels/hub/messages/bc.entity_removed'
    - $ref: '#/channels/hub/messages/bc.entity_updated'
    - $ref: '#/channels/hub/messages/bc.guest_extended'
    - $ref: '#/channels/hub/messages/bc.guests_expired'
    - $ref: '#/channels/hub/messages/bc.layout_updated'
    - $ref: '#/channels/hub/messages/bc.profiles_changed'
    - $ref: '#/channels/hub/messages/bc.family_changed'
    - $ref: '#/channels/hub/messages/bc.access_requests_changed'
    - $ref: '#/channels/hub/messages/bc.notification_deleted'
    - $ref: '#/channels/hub/messages/bc.notification_delivered'
    - $ref: '#/channels/hub/messages/bc.notification_dismissed'
    - $ref: '#/channels/hub/messages/bc.notifications_cleared'
    - $ref: '#/channels/hub/messages/bc.onboarding_ended'
    - $ref: '#/channels/hub/messages/bc.onboarding_started'
    - $ref: '#/channels/hub/messages/bc.onboarding_claimed'
    - $ref: '#/channels/hub/messages/bc.guest_invite_closed'
    - $ref: '#/channels/hub/messages/bc.guest_invite_opened'
    - $ref: '#/channels/hub/messages/bc.pairing_cancelled'
    - $ref: '#/channels/hub/messages/bc.pairing_started'
    - $ref: '#/channels/hub/messages/bc.section_created'
    - $ref: '#/channels/hub/messages/bc.section_deleted'
    - $ref: '#/channels/hub/messages/bc.section_updated'
    - $ref: '#/channels/hub/messages/bc.widget_created'
    - $ref: '#/channels/hub/messages/bc.widget_deleted'
    - $ref: '#/channels/hub/messages/bc.widget_updated'
    - $ref: '#/channels/hub/messages/bc.notification_created.integration'
    x-audience: INTEGRATION
  send_integration_provisioning:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Per-device HA user requests to the integration
    summary: 'The hub asks the integration push session to create, update or remove the HA user of one device.
      Fire-and-forget: the session stays read-only, the integration answers with POST /api/integration/client-token
      (provision) or not at all (update/deprovision). Lost messages are recovered by the status poll (provisioning[] and
      clients[]).'
    messages:
    - $ref: '#/channels/hub/messages/int.provision_client'
    - $ref: '#/channels/hub/messages/int.update_client_identity'
    - $ref: '#/channels/hub/messages/int.deprovision_client'
    x-audience: INTEGRATION
  send_integration_family_relay:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Family pushes for family managers away from home
    summary: 'The hub asks the integration push session to forward a family push to the HA WebSocket subscriptions of these family manager devices. Fire-and-forget.'
    messages:
    - $ref: '#/channels/hub/messages/int.family_relay'
    x-audience: INTEGRATION
  send_integration_enforcement_rules:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Rule snapshots to the integration
    summary: 'The hub pushes the rule snapshot of every device whose effective rules, areas, placements,
      quick access or kids rules changed (and the complete set after the integration session authenticated).
      Fire-and-forget; the status poll (enforcement.rules_hashes) and GET /api/integration/enforcement-rules are the
      backstop. See docs/enforcement.md.'
    messages:
    - $ref: '#/channels/hub/messages/int.enforcement_rules'
    x-audience: INTEGRATION
  send_integration_ha_event:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Hub events to fire in Home Assistant
    summary: 'Events of the taxonomy with source hub (pairing, guests, profiles, adjustments, kids release
      request); the integration fires them as halumar_event (alarm kinds also as halumar_alarm). Fire-and-forget.'
    messages:
    - $ref: '#/channels/hub/messages/int.ha_event'
    x-audience: INTEGRATION
  send_integration_client_location:
    action: send
    channel:
      $ref: '#/channels/hub'
    title: Position of a device for its device_tracker
    summary: 'Every location_report the hub accepted; the integration updates the device_tracker without
      polling. Fire-and-forget; the hub keeps no position.'
    messages:
    - $ref: '#/channels/hub/messages/int.client_location'
    x-audience: INTEGRATION
components:
  messages:
    ping:
      name: ping
      title: ping
      summary: Heartbeat ping (both directions).
      contentType: application/json
      payload:
        $ref: ../schemas/ws/heartbeat/ping.json
      tags:
      - name: heartbeat
      x-fixtures:
      - ../fixtures/ws/heartbeat/ping/basic.json
    pong:
      name: pong
      title: pong
      summary: Heartbeat pong (both directions).
      contentType: application/json
      payload:
        $ref: ../schemas/ws/heartbeat/pong.json
      tags:
      - name: heartbeat
      x-fixtures:
      - ../fixtures/ws/heartbeat/pong/basic.json
    c2s.pair:
      name: pair
      title: pair
      summary: Pair a new device with the active PIN (unauthenticated sessions only, 5 attempts per connection). Success authenticates
        the connection.
      contentType: application/json
      payload:
        $ref: ../schemas/ws/client/pair.json
      tags:
      - name: client-to-hub
      x-fixtures:
      - ../fixtures/ws/client/pair/basic.json
      - ../fixtures/ws/client/pair/web.json
    c2s.onboard_start:
      name: onboard_start
      title: onboard_start
      summary: 'Unpaired device asks for a one-time onboarding session (public key, client info).'
      contentType: application/json
      payload:
        $ref: ../schemas/ws/client/onboard_start.json
      tags:
      - name: client-to-hub
      x-fixtures:
      - ../fixtures/ws/client/onboard_start/basic.json
      - ../fixtures/ws/client/onboard_start/iphone.json
    c2s.onboard_lookup:
      name: onboard_lookup
      title: onboard_lookup
      summary: 'Paired device reads the session of a scanned QR code.'
      contentType: application/json
      payload:
        $ref: ../schemas/ws/client/onboard_lookup.json
      tags:
      - name: client-to-hub
      x-fixtures:
      - ../fixtures/ws/client/onboard_lookup/basic.json
      - ../fixtures/ws/client/onboard_lookup/code.json
    c2s.onboard_confirm:
      name: onboard_confirm
      title: onboard_confirm
      summary: 'Paired, permitted device confirms the onboarding.'
      contentType: application/json
      payload:
        $ref: ../schemas/ws/client/onboard_confirm.json
      tags:
      - name: client-to-hub
      x-fixtures:
      - ../fixtures/ws/client/onboard_confirm/basic.json
      - ../fixtures/ws/client/onboard_confirm/renamed.json
      - ../fixtures/ws/client/onboard_confirm/area-choice.json
      - ../fixtures/ws/client/onboard_confirm/all-areas.json
      - ../fixtures/ws/client/onboard_confirm/child.json
      - ../fixtures/ws/client/onboard_confirm/wall-panel.json
      - ../fixtures/ws/client/onboard_confirm/guest.json
      - ../fixtures/ws/client/onboard_confirm/person.json
    c2s.onboard_decline:
      name: onboard_decline
      title: onboard_decline
      summary: 'Paired device declines the onboarding.'
      contentType: application/json
      payload:
        $ref: ../schemas/ws/client/onboard_decline.json
      tags:
      - name: client-to-hub
      x-fixtures:
      - ../fixtures/ws/client/onboard_decline/basic.json
    c2s.auth:
      name: auth
      title: auth
      summary: Authenticate with the client secret (5 attempts per connection). Query-string tokens are not supported.
      contentType: application/json
      payload:
        $ref: ../schemas/ws/client/auth.json
      tags:
      - name: client-to-hub
      x-fixtures:
      - ../fixtures/ws/client/auth/basic.json
      - ../fixtures/ws/client/auth/tvos-minimal.json
    c2s.client_reset_ack:
      name: client_reset_ack
      title: client_reset_ack
      summary: Device confirms it wiped its credentials after client_removed. Accepted authenticated, or unauthenticated for
        exactly the pending id signalled during auth. Purges the tombstone; server answers client_reset_ack_ok and closes
        1000.
      contentType: application/json
      payload:
        $ref: ../schemas/ws/client/client_reset_ack.json
      tags:
      - name: client-to-hub
      x-fixtures:
      - ../fixtures/ws/client/client_reset_ack/basic.json
    c2s.client_leave:
      name: client_leave
      title: client_leave
      summary: The device signs itself off before it resets or removes this home. The hub deletes it at once (no tombstone),
        removes its HA user, answers client_leave_ok and closes 1000; a wrong client_id is answered with error.
      contentType: application/json
      payload:
        $ref: ../schemas/ws/client/client_leave.json
      tags:
      - name: client-to-hub
      x-fixtures:
      - ../fixtures/ws/client/client_leave/basic.json
    c2s.watch_access_get:
      name: watch_access_get
      title: watch_access_get
      summary: The phone that set up a watch asks for the watch's current HA access (sealed to the watch's key).
      contentType: application/json
      payload:
        $ref: ../schemas/ws/client/watch_access_get.json
      tags:
      - name: client-to-hub
      x-fixtures:
      - ../fixtures/ws/client/watch_access_get/basic.json
    c2s.subscribe:
      name: subscribe
      title: subscribe
      summary: No-op; answered with 'subscribed'. Clients need not send it.
      contentType: application/json
      payload:
        $ref: ../schemas/ws/client/subscribe.json
      tags:
      - name: client-to-hub
      x-fixtures:
      - ../fixtures/ws/client/subscribe/basic.json
      x-deprecated: true
    c2s.get_areas:
      name: get_areas
      title: get_areas
      summary: Request the visible active areas (filtered by client tags; a guest without tags gets an empty list).
      contentType: application/json
      payload:
        $ref: ../schemas/ws/client/get_areas.json
      tags:
      - name: client-to-hub
      x-fixtures:
      - ../fixtures/ws/client/get_areas/basic.json
    c2s.get_area:
      name: get_area
      title: get_area
      summary: Request one area with sections, entities (live state) and widgets. Paired clients only get areas of their own scope (their area list by tags, plus areas their notifications link to); other ids are answered with error 'Area not found'. Server paths are stripped and entity states sanitized for paired clients.
      contentType: application/json
      payload:
        $ref: ../schemas/ws/client/get_area.json
      tags:
      - name: client-to-hub
      x-fixtures:
      - ../fixtures/ws/client/get_area/basic.json
    c2s.get_client_config:
      name: get_client_config
      title: get_client_config
      summary: Request the device configuration (HA token, URLs, managed settings).
      contentType: application/json
      payload:
        $ref: ../schemas/ws/client/get_client_config.json
      tags:
      - name: client-to-hub
      x-fixtures:
      - ../fixtures/ws/client/get_client_config/basic.json
    c2s.get_notifications:
      name: get_notifications
      title: get_notifications
      summary: Request all active notifications of this paired client (connect-time catch-up). Paired clients only.
      contentType: application/json
      payload:
        $ref: ../schemas/ws/client/get_notifications.json
      tags:
      - name: client-to-hub
      x-fixtures:
      - ../fixtures/ws/client/get_notifications/basic.json
    c2s.notification_ack:
      name: notification_ack
      title: notification_ack
      summary: Confirm delivery of a notification. Paired clients only.
      contentType: application/json
      payload:
        $ref: ../schemas/ws/client/notification_ack.json
      tags:
      - name: client-to-hub
      x-fixtures:
      - ../fixtures/ws/client/notification_ack/basic.json
    c2s.notification_dismiss:
      name: notification_dismiss
      title: notification_dismiss
      summary: Dismiss a notification server-side. Paired clients only.
      contentType: application/json
      payload:
        $ref: ../schemas/ws/client/notification_dismiss.json
      tags:
      - name: client-to-hub
      x-fixtures:
      - ../fixtures/ws/client/notification_dismiss/basic.json
    c2s.client_status:
      name: client_status
      title: client_status
      summary: Report device status; any subset of the fields. Invalid values are skipped silently. Paired clients only. tvOS
        sends connection_type 'ethernet' every 300 s.
      contentType: application/json
      payload:
        $ref: ../schemas/ws/client/client_status.json
      tags:
      - name: client-to-hub
      x-fixtures:
      - ../fixtures/ws/client/client_status/ios.json
      - ../fixtures/ws/client/client_status/tvos.json
      - ../fixtures/ws/client/client_status/ipad-panel.json
      - ../fixtures/ws/client/client_status/tvos-panel.json
    s2c.area:
      name: area
      title: area
      summary: Answer to get_area.
      contentType: application/json
      payload:
        $ref: ../schemas/ws/server/area.json
      tags:
      - name: hub-to-client
      x-fixtures:
      - ../fixtures/ws/server/area/basic.json
      - ../fixtures/ws/server/area/tile.json
    s2c.areas:
      name: areas
      title: areas
      summary: Answer to get_areas.
      contentType: application/json
      payload:
        $ref: ../schemas/ws/server/areas.json
      tags:
      - name: hub-to-client
      x-fixtures:
      - ../fixtures/ws/server/areas/basic.json
    s2c.auth_error:
      name: auth_error
      title: auth_error
      summary: 'Authentication failed; reason: invalid_secret | revoked | guest_expired | rate_limited | invalid_client_info.'
      contentType: application/json
      payload:
        $ref: ../schemas/ws/server/auth_error.json
      tags:
      - name: hub-to-client
      x-fixtures:
      - ../fixtures/ws/server/auth_error/wrong-secret.json
      - ../fixtures/ws/server/auth_error/revoked.json
      - ../fixtures/ws/server/auth_error/guest-expired.json
      - ../fixtures/ws/server/auth_error/rate-limited.json
      - ../fixtures/ws/server/auth_error/malformed-client-info.json
    s2c.auth_ok:
      name: auth_ok
      title: auth_ok
      summary: 'Authentication succeeded. Sent immediately for ingress/integration sessions, after ''auth'' for paired clients.
        A repeated ''auth'' on an authenticated session yields {type: auth_ok, message: ''Already authenticated''} without
        client_id.'
      contentType: application/json
      payload:
        $ref: ../schemas/ws/server/auth_ok.json
      tags:
      - name: hub-to-client
      x-fixtures:
      - ../fixtures/ws/server/auth_ok/already-authenticated.json
      - ../fixtures/ws/server/auth_ok/guest.json
      - ../fixtures/ws/server/auth_ok/ingress.json
      - ../fixtures/ws/server/auth_ok/integration.json
      - ../fixtures/ws/server/auth_ok/paired-client.json
    s2c.auth_required:
      name: auth_required
      title: auth_required
      summary: Sent right after accept to unauthenticated sessions (with timeout), and as rejection of any other message before
        authentication (without timeout).
      contentType: application/json
      payload:
        $ref: ../schemas/ws/server/auth_required.json
      tags:
      - name: hub-to-client
      x-fixtures:
      - ../fixtures/ws/server/auth_required/on-connect.json
      - ../fixtures/ws/server/auth_required/reject-before-auth.json
    s2c.auth_timeout:
      name: auth_timeout
      title: auth_timeout
      summary: No successful auth/pair within 30 s; followed by close 4002.
      contentType: application/json
      payload:
        $ref: ../schemas/ws/server/auth_timeout.json
      tags:
      - name: hub-to-client
      x-fixtures:
      - ../fixtures/ws/server/auth_timeout/basic.json
