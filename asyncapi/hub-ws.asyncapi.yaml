    onboard_failures_per_confirming_device: 10
    onboard_failures_window_seconds: 600
    onboard_code_failures_per_device: 5
    onboard_code_failures_per_device_window_seconds: 600
    onboard_code_failures_total: 20
    onboard_code_failures_total_window_seconds: 600
    guest_invite_seconds: 300
    guest_invites_per_device: 10
    guest_invites_per_device_window_seconds: 3600
    guest_invites_open_per_device: 1
    guest_invites_open_total: 20
    control_data_max_bytes: 4096
    control_request_id_max_length: 64
    kids_state_refresh_seconds: 30
    hub_state_subscribe_min_interval_seconds: 10
    hub_reads_per_device: 10
    hub_reads_window_seconds: 10
    hub_image_requests_per_entity_per_second: 1
    hub_image_open_requests_per_entity: 1
    hub_image_open_requests_per_device: 4
    hub_image_requests_per_device: 20
    hub_image_bytes_per_device: 16777216
    hub_image_window_seconds: 10
    hub_image_max_bytes: 2097152
    hub_image_message_max_bytes: 2800000
    family_writes_per_manager: 30
    family_writes_window_seconds: 600
    family_reads_per_manager_per_minute: 60
    family_answers_per_manager_per_hour: 60
    family_open_requests_per_child_device: 1
    family_request_timeout_minutes_default: 10
    family_child_requests_per_hour_default: 6
    family_release_max_minutes: 720
  x-close-codes:
    '1000': normal (after client_reset_ack_ok or client_leave_ok, ping timeout)
    '4001': client removed (admin kick/clear of a non-guest, or no client_reset_ack within 10 s)
    '4002': auth timeout
    '4003': guest expired/kicked/cleared; invalid integration token before accept
    '4004': kicked by the integration (no reset)
    '4029': too many connections (before accept)
    '4401': admin web-UI session ended
    '4426': upgrade required (after upgrade_required)
  x-protocol:
    protocol_version: 1
    min_protocol_version: 1
    supported_previous_versions: 2
  x-planned:
    pv: protocol_version in the pairing QR/deep link (pv).
defaultContentType: application/json
servers:
  lan-plain:
    host: '{host}:8099'
    protocol: ws
    description: LAN, unencrypted (integration, unpinned apps).
    variables:
      host:
        default: homeassistant.local
    security:
    - $ref: '#/components/securitySchemes/integrationToken'
    - $ref: '#/components/securitySchemes/clientSecretInBand'
  lan-tls:
    host: '{host}:8100'
    protocol: wss
    description: LAN, TLS with self-signed leaf; clients pin the SHA-256 fingerprint from Bonjour fp, QR fp or client_config.
    variables:
      host:
        default: homeassistant.local
    security:
    - $ref: '#/components/securitySchemes/integrationToken'
    - $ref: '#/components/securitySchemes/clientSecretInBand'
  ingress:
    host: '{haHost}'
    pathname: /api/hassio_ingress/{ingressToken}
    protocol: wss
    description: Home Assistant Ingress (Admin UI).
    variables:
      haHost:
        default: homeassistant.local:8123
      ingressToken:
        default: INGRESS_TOKEN
    security:
    - $ref: '#/components/securitySchemes/ingress'
