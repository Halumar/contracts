  securitySchemes:
    integrationToken:
      type: http
      scheme: bearer
      description: Integration token in the handshake header (read-only push session).
    ingress:
      type: httpApiKey
      name: X-Ingress-Path
      in: header
      description: Trusted only from the Supervisor ingress proxy (172.30.32.2, fixed by Home Assistant); admin session.
    clientSecretInBand:
      type: userPassword
      description: 'Not a transport credential: apps authenticate in-band with the ''auth'' message (64-hex client secret)
        or pair with ''pair''. Modelled here for completeness.'
