# The round trip compiles the whole generated Models.kt (Kotlin compiler in the Gradle JVM, see the
# workflows' GRADLE_OPTS); Gradle's default heap of 512 MiB is not enough for it.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
