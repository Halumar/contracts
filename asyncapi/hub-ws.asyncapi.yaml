# AsyncAPI 3.0 description of the hub WebSocket /api/ws.
# Payload schemas live in ../schemas/ws (JSON Schema 2020-12), golden examples in ../fixtures/ws.
asyncapi: 3.0.0
info:
  title: Hub WebSocket API
  version: 1.0.0
  description: |
    WebSocket protocol of the hub (Home Assistant app), for hub 2026.12.0 (`x-hub-version`). Deviations from a clean design are listed in docs/protocol.md (Known deviations).
    The integration session also carries the per-device HA user requests provision_client, update_client_identity and deprovision_client (see docs/per-device-users.md) and the rule snapshots enforcement_rules (see docs/enforcement.md).

    The document describes the **hub** as the application: `receive` = message from a client, `send` = message from the hub.

    ## Framing
    Every frame is a UTF-8 text frame with one JSON object carrying `type`. Binary frames and JSON values that are not objects drop the connection (known deviation D7). Incoming messages > 64 KB are answered with `error` and ignored. Clients MUST ignore unknown fields and unknown message types (tolerant decoding); the hub ignores unknown fields.

    ## Connection and authentication
    1. Before accept: if `Authorization: Bearer` is present it must be the integration token, otherwise close 4003 without accept (clients see HTTP 403). Connection limits: 100 authenticated sessions, 5 unauthenticated sessions per source IP and 200 unauthenticated in total, otherwise close 4029 before accept (HTTP 403).
    2. After accept: Ingress (header `X-Ingress-Path` from the Supervisor ingress proxy (172.30.32.2, fixed by Home Assistant), `client_id` `ingress`), integration sessions (`integration`) and admin web-UI sessions with a valid session cookie over TLS and with an `Origin` equal to the host (`admin`) get `auth_ok` immediately. Everyone else gets `auth_required {timeout: 30}`. An admin web-UI session gets `session_expired` and close 4401 as soon as its session ends (checked at least every 60 s).
    3. Apps authenticate in-band with `auth {secret, <client info>}` (5 attempts per connection) or pair with `pair {pin, client_name, <client info>}` (5 attempts per connection; per source IP at most 10 failed PIN attempts in 10 min across connections, reset by a new PIN or a successful pairing from that IP; a PIN is invalidated after repeated failures from several source addresses, so a single LAN host cannot invalidate it). Query-string tokens are not supported. Client info: `protocol_version`, `platform`, `app_version` (required), `app_build`, `device_model` (optional).
    3a. Version check: `pair` is checked before the PIN, `auth` after the secret (a tombstoned secret still gets `client_removed` first). Missing or too low `protocol_version`, or `app_version` below `min_app_version[platform]`: the hub answers `upgrade_required` and closes 4426; the PIN is not consumed and the pairing stays valid. Malformed client info: `pair_error` / `auth_error` with `reason` `invalid_client_info`. `auth_ok` and `pair_ok` always carry `protocol_version`, `min_protocol_version` and `min_app_version`.
    3b. Error reasons: `auth_error` and `pair_error` always carry a machine-readable `reason` (`common/defs.json#/$defs/auth_error_reason`, `#/$defs/pair_error_reason`); `message` is English text for logs only. `auth_error`: `invalid_secret` (unknown secret: pair again), `revoked` (blocked by an admin), `guest_expired`, `rate_limited`, `invalid_client_info`. `pair_error`: `invalid_request`, `invalid_client_info`, `pin_invalid`, `pin_expired`, `too_many_failures`, `rate_limited`, `already_authenticated`, `connection_expired`, `platform_not_allowed` (the PIN's profile is not allowed on the reported platform, docs/setup.md). Clients decide only on `reason` and treat unknown reasons conservatively (auth: keep the pairing and retry with backoff; pair: like `pin_invalid`). The socket stays open after both errors.
    4. Before authentication only `pair`, `auth`, `onboard_start`, `client_reset_ack` (from a device that is being deleted) are processed; everything else is answered with `auth_required`. After 30 s (with a running onboarding session: when it expires): `auth_timeout`, close 4002.
    5. Deleted device: `auth` with a tombstoned secret yields `client_removed`; the device wipes and sends `client_reset_ack`; the hub answers `client_reset_ack_ok` and closes 1000.
    5a. Revoke, kick or delete closes the live connection at once; during the reset grace period of a deleted device only `client_reset_ack`, `ping` and `pong` are served, everything else is answered with `error` "Client removed".
    5b. A paired device signs itself off before it resets or removes this home: `client_leave {client_id}` on its authenticated socket (members, child devices and guests). The hub deletes the device at once (no tombstone), the integration removes its HA user (`deprovision_client`), open guest invitations of the device end, admin sessions get `client_kicked {reason: left}` and the audit log `client_left`; the hub answers `client_leave_ok` and closes 1000. A wrong `client_id` is answered with `error` and changes nothing. Apps send it only while connected and wait at most a few seconds; offline they reset locally and the admin deletes the device. A device without a hub socket (the watch) signs off with `POST /api/client/leave` and its own secret (same effect, 200 `client_leave_ok`).
    6. The integration session is read-only: everything except ping/pong is answered with `error`.
    6a. Paired clients read only their own scope: `get_areas` is filtered by the client's tags (`common/defs.json#/$defs/client_tags`: members without tags see all active areas; guests fail closed, without tags they see none, `"*"` = all active areas), `get_area` answers "Area not found" for areas outside the client's list (except areas its own notifications link to); server file paths (`*_path`) are removed and entity states are sanitized (no camera tokens, no GPS of people/trackers). Admin sessions get the unfiltered data.
    7. The hub sends the integration session `provision_client`, `update_client_identity` and `deprovision_client` (one HA user per device), `enforcement_rules` (rule snapshots: the complete set right after `auth_ok`, then per change; `control_paths` next to the snapshots, docs/enforcement.md), `ha_event` (events to fire in Home Assistant) and `client_location` (positions for the device trackers); the integration answers over REST.

    ## Setting up a device from a paired device
    See docs/setup.md. An unpaired device of any app platform (iPhone, iPad, Apple TV, Android phone, tablet and TV; a watch through its phone; not web: `platform_not_supported`) sends `onboard_start {public_key, client_name, <client info>}` (TLS port only, client info checked like `pair`) and gets `onboard_session {session_id, hub_id, code, expires_in: 300, expires_at}`; its connection then stays open until the session ends instead of the 30 s auth timeout. It shows a QR code (`deep-link/onboard-link.json`: hub_id, the first 32 hex characters of its pinned fingerprint, session_id, its X25519 public key) and under it the 6-digit `code`; it asks nothing about its role.

    A paired device whose effective rule `setup_devices` is on (only profiles of kind person; never guests or devices with parental controls) either scans the QR code and checks the fingerprint against its own pin, or types the code (it then relies on its own pinned connection; the waiting device gets the secret only over its own pinned TLS connection, as with a PIN).

    `onboard_lookup` (QR values or `code`) answers `onboard_info` with `grant` (`common/setup-grant.json`: the allowed kinds of `setup_devices.kinds` that fit the platform, the profiles per kind that are not stronger than the confirming device, its areas, family managers, guest limits) and tells the waiting device `onboard_claimed {by_name}`. Wrong codes count per confirming device and on the hub (`too_many_attempts`, x-limits `onboard_code_*`).

    `onboard_confirm {kind, profile_id, client_name?, owner_label?, area_ids|all_areas?, own_area_id?, start_area?, managers?, expires_at?, remote?, access_windows?}` sets it up: member (guest access with `expires_at` for kinds guest, house_sitter and babysitter, at most 90 days), the chosen profile, the choices as device adjustments (areas, panel_start, remote_access), a child added to the chosen family managers (only with the right family_manager; otherwise only managers of all children), `set_up_by` = the confirming device, own HA user; a validation error (`kind_not_allowed`, `profile_not_allowed`, `areas_not_allowed`, `expiry_not_allowed`, `managers_not_allowed`, `access_hours_not_allowed`) keeps the session open.

    The hub sends the waiting connection `onboard_ok` with the client secret sealed by HPKE (RFC 9180, X25519/HKDF-SHA256/ChaCha20Poly1305, info `hub/onboard/v1`, aad = session_id) to its public key; that connection is authenticated from then on (a watch: closed with 1000 instead, see Watches), and the confirming device gets `onboard_confirm_ok`. `onboard_decline` declines.

    A session is single-use: it ends on confirm, decline, admin cancel, expiry (`onboard_error {session_expired}`, close 4002), a public key or hub id that does not match (`session_invalidated`), a new `onboard_start` on the same connection, or when the waiting connection closes.

    `get_setup_grant {platform?, purpose?}` → `setup_grant` gives the same grant before scanning (type first) or for an invitation. “Set up by me”: `get_set_up_devices` → `set_up_devices`, `set_up_device_remove {client_id}` → `set_up_device_removed` (only devices whose `set_up_by` is this device). Errors: `onboard_error` with `reason` (`common/defs.json#/$defs/onboard_error_reason`). Log/event `device_set_up` (“Child's iPhone set up by Dad as Child 6–9”). Limits: see x-limits `onboard_*`.

    ## Guest invitations by members
    A paired member device whose rule `setup_devices` contains the kind `guest` sends `guest_invite_create {profile_id?, owner_label?, expires_at?, remote?}` (a guest profile of `setup_grant` with purpose invite, at most 90 days, remote only with remote_choice) and gets `guest_invite {invite_id, pin, deep_link, url, expires_in: 300, expires_at, grant}`: a one-time guest PIN for 5 minutes, separate from the admin's single pairing PIN (both work side by side).

    The guest pairs with the normal `pair` (PIN typed or scanned from `deep_link`, the canonical pairing link) and gets exactly what `grant` shows; every later change of the guest stays with the admin. The new guest records `set_up_by {method: invite}`, activity `paired {method: invite, invited_by}` and on the member device `guest_invited`; audit `guest_invite_created/cancelled/paired`.

    The inviting device gets `guest_invite_ended {result}` on every connection: `paired` (with client_id, client_name: show "Guest connected"), `expired`, `cancelled` (its own `guest_invite_cancel`), `revoked` (admin cancelled it, removed the right or the device), `replaced` (a new `guest_invite_create` replaces its own open invitation), `invalidated` (repeated wrong PINs from several source addresses). Its guests appear in “Set up by me” (`get_set_up_devices`).

    Errors: `guest_invite_error` with `reason` (`common/defs.json#/$defs/guest_invite_error_reason`). Admin: `GET /api/pairing/guest-invites`, `DELETE …/{id}`, broadcasts `guest_invite_opened`/`guest_invite_closed` (never the PIN). Limits: see x-limits `guest_invite*`.

    ## Hub path
    A device is on the hub path when its profile has parental controls (`client_config.profile.child_protection`) or its effective rule `control_path` is `hub` (“Hub only”). Such a device reads and switches through the hub wherever the hub is reachable. On “Hub only” without remote access it has no Home Assistant key at all (`ha_token`, `ha_instance_id`, `ha_enforcement` and `ha_url` null); with remote access it holds a read-only key for use away from home (docs/enforcement.md §7). A watch or a TV is never on the hub path (a watch has no hub socket; both always use their own key).

    `control {request_id, entity_id, service, data}` → `control_ok {adjusted?}`, `rule_blocked {reason, level, until, retry_after, limit?}` or `control_error {reason}`. The hub checks that the device is paired and active, its access (hours, switch, guest expiry), the visibility of the entity (placed in one of the device's readable areas, or the run target of such a tile), drops target keys from `data`, applies the kids rules when the device has parental controls (`common/kids-rules.json`; levels profile → area → entity, the more specific wins per rule; bedtime windows in Home Assistant's time zone) and calls Home Assistant as the device's own HA user through `<ns>.control`, which checks the rule snapshot again.

    Live states: `state_subscribe` → `state_subscribed {entity_count}`, then one `entity_state {entity_id, state}` per visible entity with its current state (snapshot of every visible entity), then one for every change of a visible entity (sanitized like `get_area`: an `entity_picture` with a token becomes the marker `attributes.hub_picture_id`, `$defs/hub_picture_id`; the app asks `camera_image_get`/`media_image_get` when it appears or changes, and nothing without it).

    Reading without a key: `history_get {request_id, entity_id, hours 1-168}` → `history {states [{state, last_changed}], truncated}` (recorder, significant changes, at most 1000 points) and `forecast_get {request_id, entity_id weather.*, forecast_type daily|hourly|twice_daily}` → `forecast {forecast []}` (`weather.get_forecasts`, at most 240), same visibility as `state_subscribe`, failures `control_error`; `state_subscribe` also relays `sun.sun` (day/night of the weather) when a weather entity is visible.

    Still images: `camera_image_get {request_id, entity_id, width?}` → `camera_image {request_id, entity_id, content_type, data_b64}` and `media_image_get {request_id, entity_id}` → `media_image {…}` (the artwork). The hub reads them with its own access to Home Assistant (`/api/camera_proxy`, `/api/media_player_proxy`), only for entities in the device's scope, and keeps no copy. Order of the checks: malformed request or a request_id still open → `invalid_request`; not on the hub path → `not_hub_controlled`; access closed, unknown entity, other domain or out of scope → `not_visible` (the same answer, before Home Assistant is contacted or a kids rule is read); limits → `rate_limited`; with parental controls a blocked device type → `rule_blocked {reason blocked}`; then Home Assistant (no redirect followed; error, no image, more than 2 MiB or another type than JPEG, PNG, WebP, GIF → `ha_error`). Content types are normalized (lower case, no parameters, `image/jpg` and `image/pjpeg` → `image/jpeg`). The answer never carries a URL, a Home Assistant camera token or a signed image URL. `width` (64-3840) is a best-effort hint: the hub passes `width` and `height = ceil(width·9/16)` to the camera proxy, which scales only JPEG, only down and by fixed factors to at least that size; the hub does not scale itself. Limits per device (x-limits `hub_image_*`): one open request per entity and at most one per second per entity, at most 4 open requests, 20 images and 16 MiB per 10 s (maxima: a hub may enforce lower shares, for example of a hub-wide limit of open reads, and answer `rate_limited` earlier; clients honor `rate_limited` with `retry_after` at any time); an image at most 2 MiB, its message at most 2 800 000 bytes, so clients accept WebSocket messages of that size. A wall of 8 cameras refreshed every 5 s needs 16 images per 10 s, typically a few MiB; the budget keeps one device from flooding the hub or Home Assistant. Live video is not part of the hub path. The app asks again while the tile or the detail view is visible.

    Limits per device (x-limits `hub_*`): a new `state_subscribe` at most every 10 s, `history_get` and `forecast_get` together at most 10 per 10 s; beyond that `control_error {rate_limited, retry_after}`.

    Devices off the hub path (control_path checked or direct, without parental controls) get `control_error {not_hub_controlled}` for all of these and read and switch through Home Assistant with their own key.

    REST twin of `control`: `POST /api/client/control` with the device secret. Activity `rule_blocked` (throttled), `profile_changed`, `kids_override`.

    ## Kids mode
    A device whose profile has parental controls (rules in `client_config.kids`) is on the hub path; the kids rules apply on every path (hub, and `<ns>.control` away from home when it holds a key, `kids.away = ha`). It defaults to “Hub only” and may be on “Checked”, never “Direct”. The app on the child's device needs Pro; without Pro it shows a notice and controls nothing, while the hub and the integration enforce the rules either way.

    ## Family manager
    A member device whose effective profile rule `family_manager` is true (`client_config.family`, never guests or devices with parental controls) manages the child devices of its scope (device property set by the admin: all, default, or selected child devices).

    It reads them with `family_get_children` → `family_children` (only the manageable kids rules of `data/family.json`, with `fixed`/`manageable` per rule, releases, status, today's counters), changes a rule on one or more child devices with `family_rule_set` / `family_rule_reset` (always a device adjustment of each child device, permanent or temporary like the admin's; never a rule fixed in the child's profile, never beyond a boundary, areas only within its own; last writer wins, logged with the actor) and starts or ends releases with `family_release` / `family_release_end` (bedtime, pause, one entity; never locks or alarm panels) → `family_result {op, results[]}`.

    Children ask with `kids_request {category}` → `kids_request_state`; the hub pushes `family_request` to every connection of every family manager of that child (away from home through the integration: `family_relay`), fires the event `kids_release_requested` (HA notify targets of the admin and the ones linked to the family managers, actionable for mobile_app targets) and expires the request after `request_timeout_minutes`.

    `family_answer {request_id, answer, preset?, message?}`: the first answer wins (`family_error {already_answered, request}` for later ones), yes is carried out as a release with the same checks.

    `family_get_activity` → `family_activity` is a read view of the log limited to the children in scope and `activity_days`. `family_notify_set` → `family_notify` switches the automatic child notifications of this device.

    Away from home the app sends the same messages through Home Assistant (HA WebSocket command `<ns>/family`, subscription `<ns>/family/subscribe`); the integration maps the calling HA user to the device and relays them over `POST /api/integration/family`; the hub decides everything.

    Errors: `family_error` with `reason` (`common/defs.json#/$defs/family_error_reason`). Limits: see x-limits `family_*`. Reference permission check: `tools/family_ref.py`, vectors `fixtures/profiles/family-check`.

    ## Unencrypted Home Assistant at home
    Apps send the HA token over `http://`/`ws://` only in a confirmed home network. Proof 1: the hub answers over TLS with the pinned certificate. Proof 2: `client_config.ha_instance_id` (HA's instance ID, reported by the integration with `POST /api/integration/ha-url`) equals the `uuid` of a `_home-assistant._tcp` Bonjour announcement in the current network (no location permission; the app caches the result per network).

    Profile rule `connection_insecure_http` (default off; suggestions Adult/Parents on; Wall panel, TV, Kids' room panel fixed off; guests and parental controls capped off) offers the switch “Always allow unencrypted (less secure)” on the device, which starts off.

    ## Location
    See docs/location.md. The rule `location` (profiles of kind person and child) is the upper limit. Devices with a Home Assistant key report their position with the integration action `<ns>.report_location` (home and away, also read-only device users; never `device_tracker.see`).

    Devices on the hub path report to the hub, only at home: `location_report {latitude, longitude, accuracy, altitude?, vertical_accuracy?, speed?, course?, battery_level?, background, ts, location_shared?}` → `location_report_ok {applied}` or `location_report_error {reason, retry_after?}` (`$defs/location_report_reason`; a device off the hub path gets `not_hub_controlled`; one report per 5 s; `applied` is false also when no integration took the fix). REST twin without a socket: `POST /api/client/location` with the device secret.

    The hub keeps no position: it hands the fix to the integration (`client_location`). `client_status.location_shared` (`none`, `foreground`, `background`) says what the app shares; the hub merges it with the metadata of the action (`POST /api/integration/location-status`). `client_status` carries no position.

    ## Tags
    See docs/links.md. A device that read a tag link `https://<website>/t/<tag_id>` (NFC, QR) sends `tag_resolve {tag_id, via?}` → `tag_result {tag_id, result, tag?, retry_after?}` (`$defs/tag_scan_result`; `tag {name, action}` only with `ok`). The hub checks the rule `scan_tags` and the device's areas, logs `tag_scanned` (`<ns>_event` and `<ns>_tag_scanned` in Home Assistant) and executes nothing; the app switches afterwards like a widget (`control_origin` `quick_access`). At most 10 per minute per device.

    ## Panel commands
    Panel commands `announce {text, volume?, chime?}` (rule `panel_announce`) and `show_camera {entity_id}` are reserved actions of `panel_command` (docs/panel.md); the hub offers them only when the app lists them in `panel.actions`.

    ## Early access
    See docs/access.md#early-access. A device outside its access hours (closed by the schedule) whose effective rule `access_requests` is on sends `access_request {note?}` → `access_request_state {request, next_allowed_at}` or `access_request_error {reason}` (`$defs/access_request_error_reason`).

    Recipients (`client_config.access.request.recipients`): the device that set it up (`set_up_by`), every person device whose `setup_devices.kinds` holds its kind and, for a babysitter, the family managers.

    They get `access_request_update` (away through `family_relay`), read open requests with `access_requests_get` → `access_requests` and answer with `access_request_answer {request_id, answer, duration?, message?}` (durations `until_window_start`, `1h`, `3h`, `today`); the first answer wins.

    Yes opens the device until then (`access_now.early`, snapshot `access.early_until`), logged with the author; events `access_requested`, `access_request_answered`, `access_request_expired`.

    Requests go only over the hub WebSocket (a closed device holds no valid HA key); recipients may answer away through `<ns>/family`.

    Admin: `GET /api/access-requests`, `POST /api/access-requests/{id}/answer`, `DELETE /api/pairing/clients/{id}/early-access`, broadcast `access_requests_changed`.

    ## Watches
    A watch (`watchos`, `wearos`) never has a hub socket. Its phone opens the onboarding session with the watch's X25519 key; the hub keeps that public key for the watch, sends `onboard_ok` (secret sealed to the key) and closes the connection with 1000 without authenticating it, so the phone never reads the watch's `client_config`.

    The phone that set the watch up (`set_up_by`) asks `watch_access_get {client_id}` on its own socket and gets `watch_access {client_id, status, sealed?}`: `ready` with the watch's whole `client_config` (incl. its HA token) sealed by HPKE to the watch's key (info `hub/watch-access/v1`, aad = client_id), `pending` while the watch holds a key that is not usable yet (not issued, held back until the integration has the watch's rules, or being replaced; a push follows), `gone` when there is no such watch of this phone (the watch forgets its access).

    The hub pushes `watch_access` to every connection of that phone whenever the watch's access changes (first or rotated HA token, profile, rules). The phone passes it on unchanged; it cannot open it. A rotation of a watch with remote access waits for its phone (not for the watch) to be connected. `client_config.ha_token` is never sent in clear for a watch.

    ## A child's watch
    See docs/setup.md and docs/protocol.md (“A child's watch”). A device with parental controls whose kids rule `kids_watch` is on binds its watch's onboarding session with `onboard_lookup` (`onboard_info.grant.child_watch.role = child`, no kinds; its own `onboard_confirm` is `not_permitted`); an adult's device with `setup_devices` kind child looks it up with the code and confirms it (`grant.child_watch.role = adult`, kind child with the phone's profile).

    The watch then follows its phone's profile, adjustments and kids state; `watch_access` carries its child `client_config`.

    Every watch follows its phone: it never has more than the phone has now (reason `limited_by_phone`); `watch_access` `gone` may name the `reason` a child's watch was removed.

    ## Tile settings
    Every entity of `get_area` carries `tile` (`common/tile-settings.json`, `{}` = default) with the hub outputs `icon_svg` and `secondary_state`. The hub delivers the settings unchanged to every client in the read scope (no per-device filtering; a `run` target does not have to be visible to the device: the admin decides).

    `hidden_on` is filtered by the app. An app may show the standard card instead (guests always do); allowed values per domain: `data/tile-capabilities.json`.

    ## Room climate
    See docs/room-climate.md. Every area of `areas` and `area` carries `room_climate {temperature, humidity}` with `source` (`admin` = picked on the area page, `auto` = the rule of `data/room-climate.json`) and `entity_ids`. The app shows the admin's entity, else the median of the thermostats with a value, else the median of the sensors with a value; without the field it applies the rule itself. The admin's change arrives as `area_updated`.

    ## Access details in client_config
    `client_config.access.set_up_by` carries only `{name, method}` (no `client_id` of the setting-up device; the admin keeps it). `client_config.access.time_zone` is the hub's IANA zone for the access-hour edges.

    ## Heartbeat
    The hub sends `ping` every 30 s to authenticated sessions and drops a session that did not answer the previous ping (in practice after 40-60 s). Clients may send `ping` at any time.

    ## Close codes
    | Code | Meaning | Expected client reaction |
    |---|---|---|
    | 1000 | normal (after client_reset_ack_ok or client_leave_ok, ping timeout) | reconnect (after reset: setup) |
    | 4001 | client removed: kick or clear-all by an admin (non-guest), fallback 10 s after unanswered client_removed | full reset |
    | 4002 | auth timeout | reconnect |
    | 4003 | guest expired, guest kicked or cleared by an admin; before accept: invalid integration token | reset to setup |
    | 4004 | kicked by the integration (no reset) | reconnect with the stored secret |
    | 4029 | too many connections (before accept) | reconnect with backoff |
    | 4401 | admin web-UI session ended (session cookie sessions only) | back to the login page |
    | 4426 | upgrade required (after `upgrade_required`): app too old for this hub | keep the pairing, show "update the app", no automatic reconnect loop |

    ## Protocol version
    One integer `protocol_version` for the whole hub protocol, starting at 1, published in `auth_ok`, `pair_ok`, `upgrade_required`, `/api/health` and Bonjour TXT (`pv`, `pv_min`). Additive changes do not bump it (tolerant decoding). Compatibility rule: the hub serves every client protocol version from `min_protocol_version` to its own `protocol_version`, and `min_protocol_version <= max(1, protocol_version - 2)`, i.e. a hub always supports at least the two previous protocol versions. A client newer than the hub speaks the hub's version if it still supports it, otherwise it shows "update the hub". `min_app_version` (per platform) is an additional floor for known-broken app builds.
